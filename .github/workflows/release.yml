name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    name: Windows x64 + arm64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (both Windows targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build doc-rs for x64 and arm64
        run: npm run build:doc-rs

      - name: Type-check and build the app
        run: npm run build

      - name: Package x64 installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Package arm64 installer
        run: npx electron-builder --win nsis --arm64 --publish never

      - name: Drop electron-builder debug log
        shell: pwsh
        run: Remove-Item dist/builder-debug.yml -ErrorAction SilentlyContinue

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Typora ${{ steps.version.outputs.value }}
          append_body: false
          make_latest: true
          body: |
            ## 安装包

            | 文件 | 适用机器 |
            | --- | --- |
            | `typora-${{ steps.version.outputs.value }}-x64-setup.exe` | Intel / AMD 机器 |
            | `typora-${{ steps.version.outputs.value }}-arm64-setup.exe` | Windows on ARM（骁龙 X 系列等） |

            安装包未做代码签名，首次运行时 SmartScreen 会拦截一次，选择「更多信息 → 仍要运行」即可。

            **提交记录**：https://github.com/chenzhi-9019/typora/commits/${{ steps.version.outputs.tag }}
          files: |
            dist/*-setup.exe
            dist/latest*.yml
