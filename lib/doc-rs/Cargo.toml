[package]
name = "doc-rs"
version = "0.1.0"
edition = "2021"
description = "Document converter used by the Typora clone in place of pandoc"
license = "MIT"

[lib]
name = "doc_rs"
path = "src/lib.rs"

[[bin]]
name = "doc-rs"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
